# Alembic configuration for LuminaFPM (V5 §14, V13 §7).
# The database URL is injected at runtime from core.config (env-based); it is
# intentionally left blank here so secrets never live in this file.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is set programmatically in alembic/env.py from settings.database_url

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
