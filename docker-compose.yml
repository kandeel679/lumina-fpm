version: '3.8'

services:
  # ---------------------------------------------
  # 1. THE DATABASE (PostgreSQL)
  # ---------------------------------------------
  db:
    image: postgres:16-alpine
    env_file: .env # 🛑 STOP HARDCODING PASSWORDS. We inject them from a hidden file.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ---------------------------------------------
  # 2. THE MESSAGE BROKER (Redis for Celery)
  # ---------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

  # ---------------------------------------------
  # 3. THE BACKEND API (FastAPI)
  # ---------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app # Live-reload: Your local code mirrors into the container
      # depends_on:
      #   - db
      #- redis
      # The command overrides the Dockerfile to ensure live-reload (--reload) is active
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    # ---------------------------------------------
    # 4. THE BACKGROUND WORKER (Celery)
    # ---------------------------------------------
    # worker:
    #   build: 
    #     context: ./backend
    #     dockerfile: Dockerfile
    #   env_file: .env
    #   volumes:
    #     - ./backend:/app
    #   depends_on:
    #     - db
    #     - redis
    # ⚠️ WARNING: This will crash your setup until Team Alpha actually writes the Celery code.
    # Keep it commented out using '#' until Phase 4, then uncomment it.
    # command: celery -A core.worker tasks --loglevel=info 

    # ---------------------------------------------1
    # 5. THE FRONTEND (React / Vite)
    # ---------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173" # Assuming you use Vite (modern React standard). Use 3000 if Create-React-App.
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules # <--- WE NAMED IT THE TRAP KILLER: Prevents local Windows node_modules from overwriting the Linux container's modules.
    depends_on:
      - api
    environment:
      - CHOKIDAR_USEPOLLING=true # Forces React to detect file changes on Windows hosts
    command: npm run dev

# ---------------------------------------------
# PERSISTENT STORAGE
# ---------------------------------------------
volumes:
  postgres_data:
  frontend_node_modules: # <--- REGISTER IT HERE
