services:
  # ---------------------------------------------
  # 1. THE DATABASE (PostgreSQL)
  # ---------------------------------------------
  db:
    image: postgres:16-alpine
    env_file: .env # 🛑 STOP HARDCODING PASSWORDS. We inject them from a hidden file.
    # PostgreSQL must NOT be exposed to the host (V12 §12, V13 Table 4). Reachable
    # only on the internal Docker network. Uncomment for local debugging ONLY.
    # ports:
    #   - "5432:5432"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------
  # 2. TOR SOCKS PROXY (for dark-web scraping)
  # ---------------------------------------------
  tor-proxy:
    build:
      context: ./tor-proxy
      dockerfile: Dockerfile
    restart: always
    ports:
      - "9050:9050"

  # ---------------------------------------------
  # 3. THE MESSAGE BROKER (Redis for Celery)
  # ---------------------------------------------
  redis:
    image: redis:7-alpine
    # Redis must NOT be exposed to the host (V12 §12, V13 Table 4). Internal only.
    # ports:
    #   - "6379:6379"
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  # ---------------------------------------------
  # 4. THE BACKEND API (FastAPI)
  # ---------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - LTI_TOR_SOCKS_HOST=tor-proxy
      - LTI_TOR_SOCKS_PORT=9050
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app # Live-reload: Your local code mirrors into the container
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The command overrides the Dockerfile to ensure live-reload (--reload) is active
    entrypoint: [ "/bin/sh", "-c", "chmod +x ./entrypoint.sh && exec ./entrypoint.sh" ]
    # command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

    # ---------------------------------------------
    # 5. THE BACKGROUND WORKER (Celery)
    # ---------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - LTI_TOR_SOCKS_HOST=tor-proxy
      - LTI_TOR_SOCKS_PORT=9050
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Auto-restart the worker when any .py under /app changes (the worker has no
    # native --reload). Without this, the bind-mounted code updates on disk but
    # the running worker keeps STALE code in memory — the cause of null
    # clean/coverage_note in early scans. Requires `watchdog` (in requirements);
    # rebuild once: `docker compose up -d --build celery_worker`.
    command:
      - watchmedo
      - auto-restart
      - --directory=/app
      - --pattern=*.py
      - --recursive
      - --ignore-patterns=*/.*;*/__pycache__/*
      - --
      - celery
      - -A
      - celery_app.celery
      - worker
      - --loglevel=info
      # Consume ALL routed queues (task_routes sends to per-job-type queues).
      # Without -Q a single worker only drains the default 'celery' queue and
      # acquisition/normalization/analysis tasks would never run.
      - -Q
      - acquisition,normalization,analysis,cti,reporting,celery
    restart: unless-stopped

  # ---------------------------------------------
  # 6. THE FRONTEND (React / Vite)
  # ---------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173" # Assuming you use Vite (modern React standard). Use 3000 if Create-React-App.
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules # <--- WE NAMED IT THE TRAP KILLER: Prevents local Windows node_modules from overwriting the Linux container's modules.
    depends_on:
      - api
    environment:
      - CHOKIDAR_USEPOLLING=true # Forces React to detect file changes on Windows hosts
      - VITE_API_PROXY=http://api:8000 # In Compose, reach the backend by service name
    command: npm run dev -- --host
  # ── ROBIN (Dark-Web OSINT Tool — kept for testing) ──
  # robin_ui:
  #   build: ./backend/services/robin
  #   ports:
  #     - "8501:8501"
  #   command: streamlit run ui.py
  #   env_file: .env
  #   volumes:
  #     - ./backend/services/robin:/app

  # robin_api:
  #   build: ./backend/services/robin
  #   ports:
  #     - "5000:5000"
  #   command: uvicorn api_bridge:app --host 0.0.0.0 --port 5000 
  #   env_file: .env
  #   volumes:
  #     - ./backend/services/robin:/app


  # ---------------------------------------------
  # PERSISTENT STORAGE
  # ---------------------------------------------
volumes:
  postgres_data:
  redis_data:
  frontend_node_modules: # <--- REGISTER IT HERE
